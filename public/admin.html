<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Administración · Bell Aroma</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script>
</head>
<body>
<header class="mast"><div class="mast-inner"><a class="brand" href="/">Bell Aroma</a><span>Administración</span></div></header>
<main>
  <section id="login" class="card login" hidden>
    <h1>Acceso al panel</h1>
    <label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password">
    <div class="bar"><button class="btn main" id="go" type="button">Entrar</button><span id="lmsg" class="err" role="status"></span></div>
  </section>
  <div id="app" class="workspace" hidden>
    <nav aria-label="Administración">
      <button type="button" data-view="catalog" aria-pressed="true" aria-controls="catalog">Catálogo</button>
      <button type="button" data-view="orders" aria-pressed="false" aria-controls="orders">Pedidos</button>
      <button type="button" data-view="settings" aria-pressed="false" aria-controls="settings">Tienda y pagos</button>
      <div class="nav-actions"><a href="/" target="_blank" rel="noopener">Ver tienda</a><button id="out" type="button">Salir</button></div>
    </nav>
    <div class="content">
      <section id="catalog">
        <div class="section-head"><h1>Catálogo</h1><button class="btn main" id="new-product" type="button">Nuevo perfume</button></div>
        <form id="product-form" class="card" hidden>
          <h2 id="ftitle">Nuevo perfume</h2>
          <div class="editor-grid">
            <div class="photo-field"><label for="file">Foto del perfume</label><div class="photo"><span>Sin foto</span><img id="prev" alt="Vista previa" hidden></div>
              <input id="file" type="file" accept="image/*" class="file-input"><label for="file" class="btn upload">Elegir imagen</label></div>
            <div class="fields">
              <label class="wide">Nombre del perfume<input id="name" required maxlength="120"></label>
              <label>Marca<input id="brand" maxlength="80"></label>
              <label>Familia olfativa<select id="family"><option value="">Sin familia</option><option>Floral</option><option>Cítrico y fresco</option><option>Dulce</option><option>Amaderado</option><option>Ámbar y especiado</option></select></label>
              <label class="wide">Descripción<textarea id="desc" maxlength="500" rows="2"></textarea></label>
              <div class="stock-fields wide">
                <label>Tamaño<input id="size" maxlength="20" placeholder="100 ml"></label>
                <label>Precio<input id="price" maxlength="20" placeholder="$45"></label>
                <label>Unidades<input id="stock" type="number" min="0" max="999999" step="1" required></label>
              </div>
              <label class="chk wide"><input id="avail" type="checkbox" checked> Disponible para venta</label>
            </div>
          </div>
          <div class="bar"><button class="btn main" id="save" type="submit">Guardar perfume</button><button class="btn" id="cancel" type="button">Cancelar</button></div>
        </form>
        <p id="msg" role="status"></p>
        <div class="card"><h2>Perfumes <span id="count" class="count">0</span></h2><div id="list"></div>
          <div class="bar"><button class="btn" id="import-catalog" type="button" disabled>Agregar perfumes de las fotos incluidas</button></div><p id="import-status" role="status"></p>
        </div>
      </section>
      <section id="orders" hidden><h1>Pedidos</h1><form class="card" id="complete-order"><h2>Finalizar una venta</h2>
        <p>Pega el código recibido por WhatsApp después de verificar el cobro.</p>
        <label for="order-code">Código del pedido</label><input id="order-code" required autocomplete="off" spellcheck="false">
        <div class="bar"><button class="btn main" id="complete-button" type="submit">Revisar pedido</button><span id="order-status" role="status"></span></div>
      </form></section>
      <section id="settings" hidden><h1>Tienda y pagos</h1><form class="card" id="settings-form"><h2>Datos de la tienda</h2>
        <div class="fields"><label>WhatsApp comercial<input id="wa" inputmode="tel" placeholder="507…" maxlength="25"></label>
          <label>Horario de atención<input id="store-hours" maxlength="120"></label>
          <label>Dirección de la tienda<input id="store-address" maxlength="160"></label>
          <label>Enlace de Google Maps (opcional)<input id="store-map" type="url" maxlength="2048" placeholder="Ubicación del local"></label></div>
        <fieldset><legend>Métodos de pago</legend><label class="alias">Alias de Yappy Comercial<input id="yappy" maxlength="60"></label>
          <div class="choices"><label class="chk"><input id="cash" type="checkbox"> Efectivo contra entrega</label><label class="chk"><input id="card" type="checkbox"> Tarjeta contra entrega (POS)</label></div>
        </fieldset>
        <div class="bar"><button class="btn main" id="saveWa" type="submit" disabled>Guardar configuración</button><span id="payment-status" role="status"></span></div>
      </form></section>
    </div>
  </div>
</main></body></html>
